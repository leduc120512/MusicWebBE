# ---------------------------------------------------------------------------
# Music API - default (development) configuration
#
# Secrets are read from the environment so nothing sensitive is committed.
# Override locally with src/main/resources/application-local.properties
# (git-ignored) or by exporting the variables below.
# ---------------------------------------------------------------------------

spring.application.name=music-api

# --- Datasource -------------------------------------------------------------
# Schema and seed data come from db/music_db.sql - import it before first run:
#   mysql -u root -p < db/music_db.sql
# sslMode: DISABLED for a local server, REQUIRED for a managed one (Aiven,
# PlanetScale, RDS). See db/README.md for the Aiven walk-through.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:music_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=${DB_TIMEZONE:Asia/Ho_Chi_Minh}&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA --------------------------------------------------------------------
# The database is owned by db/music_db.sql, not by Hibernate.
# Switch to "validate" once you have verified a fresh import starts cleanly.
spring.jpa.hibernate.ddl-auto=none
# Left at Spring Boot default (true). Several endpoints still serialise JPA
# entities directly, so the session must stay open through rendering.
# Turning this off is worth doing, but only together with a pass that returns
# a DTO from every endpoint - see README "Known issues".
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# --- Web / errors -----------------------------------------------------------
# Never expose stack traces or internal messages in HTTP responses;
# GlobalExceptionHandler owns the response body.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.throw-exception-if-no-handler-found=true

# --- Server -----------------------------------------------------------------
# Render (and most PaaS) inject PORT; SERVER_PORT is the local override.
server.port=${PORT:${SERVER_PORT:8082}}
server.tomcat.max-swallow-size=200MB

# --- File upload ------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB
# On a PaaS this must point at a writable path. Render free instances have no
# persistent disk, so anything written here is lost on redeploy - see DEPLOY.md.
app.upload.dir=${UPLOAD_DIR:D:/web nhac/duan1/upload}

# --- JWT --------------------------------------------------------------------
jwt.secret=${JWT_SECRET:ThisIsAVeryStrongJwtSecretKeyForMusicApi2026!!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Ollama (AI comment moderation / recommendations) -----------------------
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.comment-moderation-model=${OLLAMA_MODEL:llama3.1}

# --- Mail (password reset - feature not wired to a controller yet) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
