    # Database Configuration
    spring.datasource.url=jdbc:mysql://localhost:3306/music_db
    spring.datasource.username=root
    spring.datasource.password=123456
    
    # JPA
    spring.jpa.hibernate.ddl-auto=update
    
    # JWT
    jwt.secret=ThisIsAVeryStrongJwtSecretKeyForMusicApi2026!!!
    jwt.expiration=86400000
    
    # Server
    server.port=8082
    server.tomcat.max-swallow-size=200MB
    
    # Upload
    spring.servlet.multipart.enabled=true
    spring.servlet.multipart.max-file-size=200MB
    spring.servlet.multipart.max-request-size=220MB
    
    # Ollama
    ollama.base-url=http://localhost:11434
    ollama.comment-moderation-model=llama3.1
    
    # MAIL
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=your_email@gmail.com
    spring.mail.password=your_app_password
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true
    spring.mail.default-encoding=UTF-8
